# Runs the script contract test suite and the repo's own unit tests on
# Python 3.12. The contract suite lives in test/ and reads the repo
# through the REPO environment variable.
name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run script contract tests
        env:
          REPO: ${{ github.workspace }}
        run: python -m pytest test/ -v

      - name: Run repo unit tests
        run: python -m pytest tests/ -v
