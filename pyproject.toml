[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airtable-automation-toolkit"
version = "0.3.0"
description = "Python toolkit for Airtable automation: staging buffer, dead-letter queue, audit logging with PII masking, and bidirectional sync."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lorenz Espinosa", email = "renzespinosa13@gmail.com" }]
keywords = ["airtable", "automation", "staging", "dead-letter-queue", "audit-log", "pii-masking", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/lorenzespinosa/airtable-automation-toolkit"
Repository = "https://github.com/lorenzespinosa/airtable-automation-toolkit"
Author = "https://lorenzespinosa.github.io"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
